<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시장 뉴스 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ─────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #080d19;
  --surface: #0f1628;
  --surface-hover: #162038;
  --border: #1a2540;
  --border-active: #2d3f66;
  --accent: #22d3ee;
  --accent-dim: rgba(34,211,238,0.10);
  --accent-glow: rgba(34,211,238,0.20);
  --red: #f43f5e;
  --red-dim: rgba(244,63,94,0.10);
  --green: #34d399;
  --green-dim: rgba(52,211,153,0.10);
  --yellow: #fbbf24;
  --yellow-dim: rgba(251,191,36,0.10);
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --font-body: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Menlo', monospace;
}

html { background: var(--bg); }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ───────────────────────────────────────── */
.header {
  padding: 32px 20px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
}
.header-inner { max-width: 640px; margin: 0 auto; }
.header-tag {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
}
.header-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
}
.header-label {
  font-size: 11px; font-weight: 500; color: var(--accent);
  letter-spacing: 2.5px; text-transform: uppercase;
  font-family: var(--font-mono);
}
.header h1 {
  font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
  margin: 6px 0 4px;
}
.header p {
  font-size: 13px; color: var(--text-dim); line-height: 1.5;
}

/* ── Search ───────────────────────────────────────── */
.search-area {
  padding: 20px 20px 0;
  max-width: 640px; margin: 0 auto;
}
.search-row { display: flex; gap: 8px; }
.search-input {
  flex: 1; padding: 12px 16px; font-size: 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); outline: none;
  font-family: var(--font-body); transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-dim); }
.search-input:disabled { opacity: 0.5; }

.btn-search {
  padding: 12px 20px; font-size: 13px; font-weight: 600;
  background: var(--accent); color: var(--bg);
  border: none; border-radius: 10px; cursor: pointer;
  font-family: var(--font-body); white-space: nowrap;
  transition: opacity 0.2s;
}
.btn-search:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

.btn-auto {
  width: 100%; margin-top: 10px; padding: 11px 16px;
  font-size: 13px; font-weight: 500;
  background: transparent; color: var(--accent);
  border: 1px solid rgba(34,211,238,0.25);
  border-radius: 10px; cursor: pointer;
  font-family: var(--font-body); transition: background 0.2s;
}
.btn-auto:hover { background: var(--accent-dim); }
.btn-auto:disabled { color: var(--text-dim); border-color: var(--border); cursor: not-allowed; }

.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; font-size: 11px; color: var(--text-dim);
  font-family: var(--font-mono);
}

/* ── Content ──────────────────────────────────────── */
.content {
  padding: 16px 20px 48px;
  max-width: 640px; margin: 0 auto;
}

/* Loading */
.loading { text-align: center; padding: 48px 0; }
.pulse-bars {
  display: flex; gap: 5px; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.pulse-bar {
  width: 4px; border-radius: 2px; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
.pulse-bar:nth-child(1) { height: 18px; animation-delay: 0s; }
.pulse-bar:nth-child(2) { height: 24px; animation-delay: 0.12s; }
.pulse-bar:nth-child(3) { height: 30px; animation-delay: 0.24s; }
.pulse-bar:nth-child(4) { height: 24px; animation-delay: 0.36s; }
.pulse-bar:nth-child(5) { height: 18px; animation-delay: 0.48s; }
@keyframes pulse {
  0%, 100% { transform: scaleY(1); opacity: 0.35; }
  50% { transform: scaleY(1.6); opacity: 1; }
}
.loading-text { font-size: 13px; color: var(--text-muted); }

/* Error */
.error-box {
  padding: 14px 18px; background: var(--red-dim);
  border: 1px solid rgba(244,63,94,0.2); border-radius: 12px;
  font-size: 13px; color: var(--red); line-height: 1.5;
  word-break: break-all; margin-top: 8px;
}

/* Empty */
.empty {
  text-align: center; padding: 64px 20px;
}
.empty-icon { font-size: 40px; opacity: 0.25; margin-bottom: 16px; }
.empty p { font-size: 13px; color: var(--text-dim); line-height: 1.7; }

/* Result header */
.result-header { margin-bottom: 16px; }
.result-timestamp {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 10px; font-size: 12px; color: var(--text-dim);
  font-family: var(--font-mono);
}
.result-title {
  font-size: 17px; font-weight: 700; margin: 0 0 8px; line-height: 1.4;
}
.result-summary {
  font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.65;
}

/* Cards */
.cards { display: flex; flex-direction: column; gap: 10px; }

.news-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px;
  cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s;
  animation: fadeSlide 0.4s ease both;
}
.news-card:hover { border-color: var(--border-active); }
.news-card.open {
  border-color: var(--border-active);
  box-shadow: 0 0 16px var(--accent-glow);
}

.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-body { flex: 1; min-width: 0; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }

.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
}
.badge-positive { background: var(--green-dim); color: var(--green); border: 1px solid rgba(52,211,153,0.15); }
.badge-negative { background: var(--red-dim); color: var(--red); border: 1px solid rgba(244,63,94,0.15); }
.badge-neutral  { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(251,191,36,0.15); }

.card-source { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
.card-date {
  font-size: 10px; color: var(--text-dim); font-family: var(--font-mono);
  background: rgba(255,255,255,0.04); padding: 1px 7px; border-radius: 4px;
}

.card-headline {
  margin: 0; font-size: 14px; font-weight: 600;
  color: var(--text); line-height: 1.5;
}
.card-summary {
  margin: 6px 0 0; font-size: 13px; color: var(--text-muted); line-height: 1.55;
}

.card-chevron {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px;
  background: var(--accent-dim); display: flex; align-items: center;
  justify-content: center; transition: transform 0.25s;
  color: var(--accent); font-size: 13px;
}
.news-card.open .card-chevron { transform: rotate(180deg); }

.card-detail {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 13px; color: var(--text-muted); line-height: 1.85;
  display: none;
}
.news-card.open .card-detail { display: block; animation: fadeIn 0.3s ease; }

/* Footer */
.disclaimer {
  margin-top: 20px; padding: 11px 16px;
  background: var(--surface); border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 11px; color: var(--text-dim); text-align: center;
  font-family: var(--font-mono); line-height: 1.5;
}

/* Animations */
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
</style>
</head>
<body>

<!-- ── Header ────────────────────────────────────── -->
<div class="header">
  <div class="header-inner">
    <div class="header-tag">
      <span class="header-dot"></span>
      <span class="header-label">Live · Briefing</span>
    </div>
    <h1>시장 뉴스 브리핑</h1>
    <p>키워드 입력 또는 자동 탐색으로 실시간 시장 동향을 확인하세요</p>
  </div>
</div>

<!-- ── Search ────────────────────────────────────── -->
<div class="search-area">
  <div class="search-row">
    <input
      type="text" id="keyword-input" class="search-input"
      placeholder="키워드 입력 (예: 반도체, AI, 2차전지)"
      maxlength="100"
    >
    <button id="btn-search" class="btn-search" disabled>검색</button>
  </div>
  <button id="btn-auto" class="btn-auto">⚡ 급변 분야 자동 탐색</button>
  <div class="status-bar">
    <span>요청 횟수: <span id="req-count">0</span></span>
    <span>테스트 모드</span>
  </div>
</div>

<!-- ── Content ───────────────────────────────────── -->
<div class="content" id="content">
  <div class="empty" id="empty-state">
    <div class="empty-icon">📊</div>
    <p>키워드를 입력하거나<br>자동 탐색 버튼을 눌러보세요</p>
  </div>
</div>

<script>
// ── 설정 ─────────────────────────────────────────
// ★ 배포 후 실제 Worker URL로 변경할 것
const WORKER_URL = "https://YOUR-WORKER-NAME.YOUR-ACCOUNT.workers.dev/api/briefing";

// ── DOM ──────────────────────────────────────────
const $input    = document.getElementById("keyword-input");
const $btnSearch = document.getElementById("btn-search");
const $btnAuto   = document.getElementById("btn-auto");
const $content   = document.getElementById("content");
const $reqCount  = document.getElementById("req-count");

let isLoading = false;
let requestCount = 0;

// ── 입력 이벤트 ──────────────────────────────────
$input.addEventListener("input", () => {
  $btnSearch.disabled = !$input.value.trim() || isLoading;
});

$input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && $input.value.trim() && !isLoading) {
    search("keyword", $input.value.trim());
  }
});

$btnSearch.addEventListener("click", () => {
  if ($input.value.trim() && !isLoading) {
    search("keyword", $input.value.trim());
  }
});

$btnAuto.addEventListener("click", () => {
  if (!isLoading) search("auto", "");
});

// ── 검색 요청 ────────────────────────────────────
async function search(mode, keyword) {
  if (isLoading) return;
  isLoading = true;
  setDisabled(true);
  showLoading();

  try {
    const body = { mode };
    if (mode === "keyword") body.keyword = keyword;

    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }

    if (!data.items || !Array.isArray(data.items)) {
      throw new Error("응답 형식이 올바르지 않습니다.");
    }

    requestCount++;
    $reqCount.textContent = requestCount;
    showResult(data);

  } catch (err) {
    showError(err.message || "요청 중 오류가 발생했습니다.");
  } finally {
    isLoading = false;
    setDisabled(false);
  }
}

function setDisabled(disabled) {
  $input.disabled = disabled;
  $btnSearch.disabled = disabled || !$input.value.trim();
  $btnAuto.disabled = disabled;
}

// ── 로딩 표시 ────────────────────────────────────
function showLoading() {
  $content.innerHTML = `
    <div class="loading">
      <div class="pulse-bars">
        <div class="pulse-bar"></div>
        <div class="pulse-bar"></div>
        <div class="pulse-bar"></div>
        <div class="pulse-bar"></div>
        <div class="pulse-bar"></div>
      </div>
      <p class="loading-text">시장 뉴스를 검색하고 있습니다<span id="dots"></span></p>
    </div>
  `;
  animateDots();
}

function animateDots() {
  const $dots = document.getElementById("dots");
  if (!$dots) return;
  let count = 0;
  const iv = setInterval(() => {
    if (!document.getElementById("dots")) { clearInterval(iv); return; }
    count = (count + 1) % 4;
    $dots.textContent = ".".repeat(count);
  }, 400);
}

// ── 에러 표시 ────────────────────────────────────
function showError(msg) {
  $content.innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
}

// ── 결과 렌더링 ──────────────────────────────────
function showResult(data) {
  let html = `<div class="result-header">`;

  // 타임스탬프
  if (data.timestamp) {
    html += `
      <div class="result-timestamp">
        <span>⏰</span>
        <span>${escapeHtml(data.timestamp)} 기준 최근 뉴스</span>
      </div>`;
  }

  html += `
      <h2 class="result-title">${escapeHtml(data.title || "")}</h2>
      <p class="result-summary">${escapeHtml(data.summary || "")}</p>
    </div>
    <div class="cards">`;

  data.items.forEach((item, idx) => {
    const sentimentClass =
      item.sentiment === "positive" ? "badge-positive" :
      item.sentiment === "negative" ? "badge-negative" : "badge-neutral";
    const sentimentLabel =
      item.sentiment === "positive" ? "▲ 긍정" :
      item.sentiment === "negative" ? "▼ 부정" : "● 중립";

    html += `
      <div class="news-card" style="animation-delay: ${idx * 0.06}s" onclick="this.classList.toggle('open')">
        <div class="card-top">
          <div class="card-body">
            <div class="card-meta">
              <span class="badge ${sentimentClass}">${sentimentLabel}</span>
              ${item.source ? `<span class="card-source">${escapeHtml(item.source)}</span>` : ""}
              ${item.date ? `<span class="card-date">${escapeHtml(item.date)}</span>` : ""}
            </div>
            <h3 class="card-headline">${escapeHtml(item.headline || "")}</h3>
            <p class="card-summary">${escapeHtml(item.summary || "")}</p>
          </div>
          <div class="card-chevron">▾</div>
        </div>
        <div class="card-detail">${escapeHtml(item.detail || "")}</div>
      </div>`;
  });

  html += `
    </div>
    <div class="disclaimer">
      ℹ︎ 카드를 탭하면 세부 분석이 펼쳐집니다 · 투자 판단의 참고 자료이며 투자 권유가 아닙니다
    </div>`;

  $content.innerHTML = html;
}

// ── 유틸 ─────────────────────────────────────────
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
